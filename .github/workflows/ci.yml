name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
      - fix/**
      - refactor/**
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Checklist.Mvc.slnx

      - name: Build
        run: dotnet build Checklist.Mvc.slnx --no-restore --configuration Release

      # Reativar quando existir um projeto de teste de verdade (xUnit) no repo, ex:
      # - name: Run tests
      #   run: dotnet test Checklist.Mvc.slnx --no-restore --configuration Release
